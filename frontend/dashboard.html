<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body { background-color: #0b1326; color: #dae2fd; font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(30, 42, 56, 0.6);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="glass-card px-8 py-4 flex justify-between items-center sticky top-0 z-50">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-[#aec8f5] flex items-center justify-center">
      <span class="material-symbols-outlined text-[#143156] text-lg">task_alt</span>
    </div>
    <span class="font-bold text-lg font-['Manrope']">TaskFlow</span>
  </div>
  <div class="flex items-center gap-6">
    <a href="dashboard.html" class="text-[#aec8f5] font-semibold text-sm">Dashboard</a>
    <a href="projects.html" class="text-[#8e9196] hover:text-[#dae2fd] text-sm">Projets</a>
    <div class="relative">
      <button onclick="toggleNotif()" class="relative">
        <span class="material-symbols-outlined text-[#8e9196]">notifications</span>
        <span id="notif-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-xs flex items-center justify-center hidden">0</span>
      </button>
      <div id="notif-panel" class="hidden absolute right-0 top-10 w-80 glass-card rounded-xl p-4 shadow-2xl"></div>
    </div>
    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-sm px-4 py-2 rounded-lg transition-all">
      Déconnexion
    </button>
  </div>
</nav>

<!-- CONTENU -->
<main class="max-w-6xl mx-auto px-6 py-8">

  <!-- Titre -->
  <div class="mb-8">
    <h1 class="text-2xl font-bold font-['Manrope']">Bonjour, <span id="user-name">—</span> 👋</h1>
    <p class="text-[#8e9196] text-sm mt-1">Voici un résumé de votre activité</p>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
    <div class="glass-card rounded-xl p-5 flex flex-col gap-2">
      <span class="material-symbols-outlined text-[#aec8f5]">folder</span>
      <span id="stat-projects" class="text-3xl font-bold text-[#aec8f5]">—</span>
      <span class="text-xs text-[#8e9196]">Projets actifs</span>
    </div>
    <div class="glass-card rounded-xl p-5 flex flex-col gap-2">
      <span class="material-symbols-outlined text-purple-400">assignment</span>
      <span id="stat-assigned" class="text-3xl font-bold text-purple-400">—</span>
      <span class="text-xs text-[#8e9196]">Tâches assignées</span>
    </div>
    <div class="glass-card rounded-xl p-5 flex flex-col gap-2">
      <span class="material-symbols-outlined text-green-400">check_circle</span>
      <span id="stat-done" class="text-3xl font-bold text-green-400">—</span>
      <span class="text-xs text-[#8e9196]">Tâches terminées</span>
    </div>
    <div class="glass-card rounded-xl p-5 flex flex-col gap-2">
      <span class="material-symbols-outlined text-red-400">warning</span>
      <span id="stat-late" class="text-3xl font-bold text-red-400">—</span>
      <span class="text-xs text-[#8e9196]">Tâches en retard</span>
    </div>
  </div>

  <!-- Tâches en cours -->
  <div class="glass-card rounded-xl p-6">
    <h2 class="text-lg font-bold font-['Manrope'] mb-4">Tâches en cours</h2>
    <div id="tasks-list">
      <p class="text-[#8e9196] text-sm">Chargement...</p>
    </div>
  </div>

</main>
<script>
  const API   = 'http://localhost:5000/api';
  const token = localStorage.getItem('token');
  const user  = JSON.parse(localStorage.getItem('user') || 'null');

  if (!token) window.location.href = 'index.html';
  if (user) document.getElementById('user-name').textContent = user.fullName;

  // ── DASHBOARD ─────────────────────────────────────────────────
  async function loadDashboard() {
    try {
      const { data } = await axios.get(`${API}/dashboard`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      document.getElementById('stat-projects').textContent = data.activeProjects;
      document.getElementById('stat-assigned').textContent = data.totalAssigned;
      document.getElementById('stat-done').textContent     = data.totalDone;
      document.getElementById('stat-late').textContent     = data.totalLate;

      const list = document.getElementById('tasks-list');
      if (!data.inProgressTasks.length) {
        list.innerHTML = '<p class="text-[#8e9196] text-sm">Aucune tâche en cours 🎉</p>';
        return;
      }
      list.innerHTML = data.inProgressTasks.map(t => `
        <div class="flex justify-between items-center py-3 border-b border-white/5">
          <div>
            <p class="font-semibold text-sm">${t.title}</p>
            <p class="text-xs text-[#8e9196]">${t.project?.title || '—'}</p>
          </div>
          <span class="text-xs px-3 py-1 rounded-full ${
            t.priority === 'haute'   ? 'bg-red-500/20 text-red-400' :
            t.priority === 'moyenne' ? 'bg-yellow-500/20 text-yellow-400' :
                                       'bg-green-500/20 text-green-400'
          }">${t.priority}</span>
        </div>
      `).join('');
    } catch (err) { console.error(err); }
  }

  // ── NOTIFICATIONS ─────────────────────────────────────────────
  async function loadNotifications() {
    try {
      const { data } = await axios.get(`${API}/notifications`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      const unread = data.filter(n => !n.read).length;
      const badge  = document.getElementById('notif-badge');
      if (unread > 0) {
        badge.textContent = unread;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      const panel = document.getElementById('notif-panel');
      if (!data.length) {
        panel.innerHTML = '<p class="text-[#8e9196] text-sm p-2">Aucune notification</p>';
        return;
      }
      panel.innerHTML = data.map(n => `
        <div onclick="markRead('${n._id}')" 
          class="p-3 border-b border-white/5 cursor-pointer hover:bg-white/5 ${n.read ? '' : 'bg-[#aec8f5]/10'}">
          <p class="text-sm ${n.read ? 'text-[#8e9196]' : 'text-[#dae2fd] font-semibold'}">${n.message}</p>
          <p class="text-xs text-[#8e9196] mt-1">${timeAgo(new Date(n.createdAt))}</p>
        </div>
      `).join('');

      // Archiver dans localStorage
      localStorage.setItem('notif_archived', JSON.stringify(data.filter(n => n.read)));
    } catch (err) { console.error(err); }
  }

  async function markRead(id) {
  try {
    await axios.patch(`${API}/notifications/${id}/read`, {}, {
      headers: { Authorization: `Bearer ${token}` }
    });
    await loadNotifications();
    document.getElementById('notif-panel').classList.add('hidden');
  } catch (err) { console.error(err); }
}

  function toggleNotif() {
    const panel = document.getElementById('notif-panel');
    panel.classList.toggle('hidden');
    if (!panel.classList.contains('hidden')) loadNotifications();
  }

  function timeAgo(date) {
    const diff = Math.floor((Date.now() - date) / 1000);
    if (diff < 60) return 'à l\'instant';
    if (diff < 3600) return `il y a ${Math.floor(diff/60)} min`;
    if (diff < 86400) return `il y a ${Math.floor(diff/3600)} h`;
    return `il y a ${Math.floor(diff/86400)} j`;
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
  }

  // ── POLLING toutes les 30 secondes ────────────────────────────
  loadDashboard();
  loadNotifications();
  setInterval(loadNotifications, 30000);
</script>

</body>
</html>
