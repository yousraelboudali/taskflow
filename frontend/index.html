<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body { background-color: #0b1326; color: #dae2fd; }
    .glass-card {
      background: rgba(30, 42, 56, 0.6);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .glass-input {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
    }
    .glass-input:focus {
      border-color: #98B2DE;
      background: rgba(255,255,255,0.05);
      box-shadow: 0 0 15px rgba(152,178,222,0.2);
      outline: none;
    }
    .floating-orb {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(174,200,245,0.15) 0%, transparent 70%);
      filter: blur(60px); z-index: 0;
      animation: float 20s infinite alternate ease-in-out;
    }
   .floating-orb {
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(174,200,245,0.15) 0%, transparent 70%);
    filter: blur(60px); 
    z-index: 0;
}
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 font-['Inter']">

  <div class="floating-orb top-[-100px] left-[-100px]"></div>
  <div class="floating-orb bottom-[-100px] right-[-100px]" style="animation-delay:-10s"></div>

  <main class="w-full max-w-[480px] z-10">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-8 space-y-2">
      <div class="w-12 h-12 rounded-xl bg-[#aec8f5] flex items-center justify-center shadow-lg mb-4">
        <span class="material-symbols-outlined text-[#143156] text-3xl">task_alt</span>
      </div>
      <h1 class="text-3xl font-bold text-[#dae2fd] font-['Manrope']">TaskFlow</h1>
      <p class="text-[#c4c6cc] text-sm">Votre espace de travail collaboratif</p>
    </div>

    <!-- Card -->
    <section class="glass-card rounded-xl p-8 shadow-2xl">

      <!-- Onglets -->
      <div class="flex gap-2 mb-6">
        <button id="btn-login" onclick="switchTab('login')"
          class="flex-1 py-2 rounded-lg bg-[#aec8f5] text-[#143156] font-semibold text-sm transition-all">
          Connexion
        </button>
        <button id="btn-register" onclick="switchTab('register')"
          class="flex-1 py-2 rounded-lg glass-input text-[#c4c6cc] font-semibold text-sm transition-all">
          Inscription
        </button>
      </div>

      <!-- Formulaire Connexion -->
      <div id="tab-login" class="space-y-5">
        <div class="space-y-2">
          <label class="text-xs font-semibold text-[#c4c6cc] tracking-widest uppercase ml-1">Email</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#8e9196] text-[20px]">mail</span>
            <input id="login-email" type="email" placeholder="nom@exemple.com"
              class="w-full h-12 pl-12 pr-4 rounded-lg glass-input text-[#dae2fd] placeholder:text-[#8e9196] text-sm"/>
          </div>
        </div>
        <div class="space-y-2">
          <label class="text-xs font-semibold text-[#c4c6cc] tracking-widest uppercase ml-1">Mot de passe</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#8e9196] text-[20px]">lock</span>
            <input id="login-password" type="password" placeholder="••••••••"
              class="w-full h-12 pl-12 pr-4 rounded-lg glass-input text-[#dae2fd] placeholder:text-[#8e9196] text-sm"/>
          </div>
        </div>
        <button onclick="login()"
          class="w-full h-12 bg-[#aec8f5] text-[#143156] font-semibold text-sm rounded-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2">
          Se connecter
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </button>
        <p id="login-error" class="text-red-400 text-sm text-center hidden"></p>
      </div>

      <!-- Formulaire Inscription -->
      <div id="tab-register" class="space-y-5 hidden">
        <div class="space-y-2">
          <label class="text-xs font-semibold text-[#c4c6cc] tracking-widest uppercase ml-1">Nom complet</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#8e9196] text-[20px]">person</span>
            <input id="reg-name" type="text" placeholder="Prénom Nom"
              class="w-full h-12 pl-12 pr-4 rounded-lg glass-input text-[#dae2fd] placeholder:text-[#8e9196] text-sm"/>
          </div>
        </div>
        <div class="space-y-2">
          <label class="text-xs font-semibold text-[#c4c6cc] tracking-widest uppercase ml-1">Email</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#8e9196] text-[20px]">mail</span>
            <input id="reg-email" type="email" placeholder="nom@exemple.com"
              class="w-full h-12 pl-12 pr-4 rounded-lg glass-input text-[#dae2fd] placeholder:text-[#8e9196] text-sm"/>
          </div>
        </div>
        <div class="space-y-2">
          <label class="text-xs font-semibold text-[#c4c6cc] tracking-widest uppercase ml-1">Mot de passe</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#8e9196] text-[20px]">lock</span>
            <input id="reg-password" type="password" placeholder="••••••••"
              class="w-full h-12 pl-12 pr-4 rounded-lg glass-input text-[#dae2fd] placeholder:text-[#8e9196] text-sm"/>
          </div>
        </div>
        <button onclick="register()"
          class="w-full h-12 bg-[#aec8f5] text-[#143156] font-semibold text-sm rounded-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2">
          Créer mon compte
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </button>
        <p id="register-error" class="text-red-400 text-sm text-center hidden"></p>
      </div>

    </section>

    <p class="mt-8 text-center text-xs text-[#8e9196] uppercase tracking-widest">© 2026 TaskFlow</p>
  </main>

 <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
