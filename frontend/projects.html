<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — Projets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body { background-color: #0b1326; color: #dae2fd; font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(30,42,56,0.6); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); }
    .glass-input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); }
    .glass-input:focus { border-color: #aec8f5; outline: none; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
    .modal-bg { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="glass-card px-8 py-4 flex justify-between items-center sticky top-0 z-50">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-[#aec8f5] flex items-center justify-center">
      <span class="material-symbols-outlined text-[#143156] text-lg">task_alt</span>
    </div>
    <span class="font-bold text-lg font-['Manrope']">TaskFlow</span>
  </div>
  <div class="flex items-center gap-6">
    <a href="dashboard.html" class="text-[#8e9196] hover:text-[#dae2fd] text-sm">Dashboard</a>
    <a href="projects.html" class="text-[#aec8f5] font-semibold text-sm">Projets</a>
    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-sm px-4 py-2 rounded-lg">
      Déconnexion
    </button>
  </div>
</nav>

<!-- CONTENU -->
<main class="max-w-6xl mx-auto px-6 py-8">

  <!-- Header -->
  <div class="flex justify-between items-center mb-8">
    <div>
      <h1 class="text-2xl font-bold font-['Manrope']">Mes Projets</h1>
      <p class="text-[#8e9196] text-sm mt-1">Gérez vos projets collaboratifs</p>
    </div>
    <button onclick="openModal()" 
      class="bg-[#aec8f5] text-[#143156] font-semibold text-sm px-5 py-2.5 rounded-lg hover:brightness-110 flex items-center gap-2">
      <span class="material-symbols-outlined text-lg">add</span>
      Nouveau projet
    </button>
  </div>

  <!-- Liste projets -->
  <div id="projects-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

  <!-- Pagination -->
  <div id="pagination" class="flex justify-center gap-2 mt-8"></div>

</main>

<!-- MODAL NOUVEAU PROJET -->
<div id="modal" class="fixed inset-0 modal-bg z-50 hidden flex items-center justify-center">
  <div class="glass-card rounded-xl p-8 w-full max-w-md shadow-2xl">
    <h2 id="modal-title" class="text-lg font-bold font-['Manrope'] mb-6">Nouveau projet</h2>
    
    <div class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-[#8e9196] uppercase tracking-widest">Titre *</label>
        <input id="proj-title" type="text" placeholder="Mon projet"
          class="w-full h-11 px-4 mt-1 rounded-lg glass-input text-[#dae2fd] placeholder:text-[#8e9196] text-sm"/>
      </div>
      <div>
        <label class="text-xs font-semibold text-[#8e9196] uppercase tracking-widest">Description</label>
        <textarea id="proj-desc" placeholder="Description du projet..."
          class="w-full px-4 py-3 mt-1 rounded-lg glass-input text-[#dae2fd] placeholder:text-[#8e9196] text-sm resize-none h-24"></textarea>
      </div>
      <div>
        <label class="text-xs font-semibold text-[#8e9196] uppercase tracking-widest">Date limite</label>
        <input id="proj-deadline" type="date"
          class="w-full h-11 px-4 mt-1 rounded-lg glass-input text-[#dae2fd] text-sm"/>
      </div>
      <div>
        <label class="text-xs font-semibold text-[#8e9196] uppercase tracking-widest">Statut</label>
        <select id="proj-status"
          class="w-full h-11 px-4 mt-1 rounded-lg glass-input text-[#dae2fd] text-sm">
          <option value="actif">Actif</option>
          <option value="en pause">En pause</option>
          <option value="archivé">Archivé</option>
        </select>
      </div>
    </div>

    <div class="flex gap-3 mt-6">
      <button onclick="saveProject()"
        class="flex-1 bg-[#aec8f5] text-[#143156] font-semibold text-sm py-2.5 rounded-lg hover:brightness-110">
        Enregistrer
      </button>
      <button onclick="closeModal()"
        class="flex-1 glass-input text-[#dae2fd] text-sm py-2.5 rounded-lg hover:bg-white/5">
        Annuler
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
  const API   = 'http://localhost:5000/api';
  const token = localStorage.getItem('token');
  if (!token) window.location.href = 'index.html';

  let currentPage    = 1;
  let editingId      = null;

  // Charger les projets
  async function loadProjects(page = 1) {
    currentPage = page;
    try {
      const { data } = await axios.get(`${API}/projects?page=${page}&limit=6`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      const list = document.getElementById('projects-list');
      list.innerHTML = '';

      if (!data.data.length) {
        list.innerHTML = `
          <div class="col-span-3 text-center py-16">
            <span class="material-symbols-outlined text-5xl text-[#8e9196]">folder_open</span>
            <p class="text-[#8e9196] mt-3">Aucun projet. Créez-en un !</p>
          </div>`;
        return;
      }

      data.data.forEach(p => {
        const statusColor = p.status === 'actif' ? 'text-green-400 bg-green-400/10' :
                            p.status === 'en pause' ? 'text-yellow-400 bg-yellow-400/10' :
                            'text-[#8e9196] bg-white/5';
        const card = document.createElement('div');
        card.className = 'glass-card rounded-xl p-6 flex flex-col gap-4 hover:border-[#aec8f5]/30 transition-all cursor-pointer';
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <h3 class="font-semibold font-['Manrope'] text-base">${p.title}</h3>
            <span class="text-xs px-2 py-1 rounded-full ${statusColor}">${p.status}</span>
          </div>
          <p class="text-[#8e9196] text-sm flex-1">${p.description || 'Pas de description'}</p>
          <div class="flex justify-between items-center pt-2 border-t border-white/5">
            <span class="text-xs text-[#8e9196]">👥 ${p.members.length} membre(s)</span>
            ${p.deadline ? `<span class="text-xs text-[#8e9196]">📅 ${new Date(p.deadline).toLocaleDateString('fr-FR')}</span>` : ''}
          </div>
          <div class="flex gap-2">
            <button onclick="goToDetail('${p._id}')" 
              class="flex-1 bg-[#aec8f5]/10 text-[#aec8f5] text-xs py-2 rounded-lg hover:bg-[#aec8f5]/20">
              Voir les tâches
            </button>
            <button onclick="openModal('${p._id}')" 
              class="px-3 py-2 glass-input text-[#8e9196] text-xs rounded-lg hover:text-[#dae2fd]">
              ✏️
            </button>
            <button onclick="deleteProject('${p._id}')" 
              class="px-3 py-2 bg-red-500/10 text-red-400 text-xs rounded-lg hover:bg-red-500/20">
              🗑️
            </button>
          </div>`;
        list.appendChild(card);
      });

      // Pagination
      const pages = document.getElementById('pagination');
      pages.innerHTML = '';
      for (let i = 1; i <= data.totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = i === page
          ? 'w-9 h-9 rounded-lg bg-[#aec8f5] text-[#143156] font-semibold text-sm'
          : 'w-9 h-9 rounded-lg glass-input text-[#8e9196] text-sm hover:text-[#dae2fd]';
        btn.onclick = () => loadProjects(i);
        pages.appendChild(btn);
      }
    } catch (err) { console.error(err); }
  }

  // Ouvrir modal
  function openModal(id = null) {
    editingId = id;
    document.getElementById('modal-title').textContent = id ? 'Modifier le projet' : 'Nouveau projet';
    document.getElementById('proj-title').value    = '';
    document.getElementById('proj-desc').value     = '';
    document.getElementById('proj-deadline').value = '';
    document.getElementById('proj-status').value   = 'actif';

    if (id) {
      axios.get(`${API}/projects/${id}`, { headers: { Authorization: `Bearer ${token}` } })
        .then(({ data: p }) => {
          document.getElementById('proj-title').value    = p.title;
          document.getElementById('proj-desc').value     = p.description || '';
          document.getElementById('proj-deadline').value = p.deadline ? p.deadline.slice(0,10) : '';
          document.getElementById('proj-status').value   = p.status;
        });
    }
    document.getElementById('modal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
  }

  // Sauvegarder projet
  async function saveProject() {
    const body = {
      title:       document.getElementById('proj-title').value.trim(),
      description: document.getElementById('proj-desc').value.trim(),
      deadline:    document.getElementById('proj-deadline').value || undefined,
      status:      document.getElementById('proj-status').value,
    };
    if (!body.title) return alert('Le titre est requis');
    try {
      if (editingId) {
        await axios.put(`${API}/projects/${editingId}`, body, { headers: { Authorization: `Bearer ${token}` } });
      } else {
        await axios.post(`${API}/projects`, body, { headers: { Authorization: `Bearer ${token}` } });
      }
      closeModal();
      loadProjects(currentPage);
    } catch (err) { alert(err.response?.data?.message || 'Erreur'); }
  }

  // Supprimer projet
  async function deleteProject(id) {
    if (!confirm('Supprimer ce projet ?')) return;
    await axios.delete(`${API}/projects/${id}`, { headers: { Authorization: `Bearer ${token}` } });
    loadProjects(currentPage);
  }

  function goToDetail(id) {
    localStorage.setItem('currentProject', id);
    window.location.href = 'project-detail.html';
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
  }

  loadProjects();
</script>
</body>
</html>
